<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Split PDF — tools</title>
<meta name="description" content="Pull a page range out of a PDF. Runs in your browser; files are never uploaded.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%231F3A2E'/><path d='M8 7h11l5 5v13H8z' fill='none' stroke='%232B44FF' stroke-width='2.5'/></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
</head>
<body>
<div class="wrap">

  <header class="top">
    <a class="mark" href="../">tools<span>.</span></a>
    <p class="local"><a class="back" href="../">All tools</a></p>
  </header>

  <main>
    <h1>Split PDF</h1>
    <p class="lede">Choose a PDF, say which pages you want, and get those pages back as a new file. The original is left alone.</p>

    <label class="tray" id="tray">
      <strong>Drop a PDF here</strong>
      <span>or click to choose one</span>
      <input type="file" id="pick" accept="application/pdf">
    </label>

    <ul class="files" id="files"></ul>

    <div class="row">
      <div>
        <label for="range">Pages to keep</label>
        <input type="text" id="range" value="1" size="18" placeholder="1-3, 7, 10-12">
      </div>
    </div>

    <button class="go" id="go" disabled>Take these pages</button>

    <div class="out" id="out" hidden></div>
    <p class="err" id="err" hidden></p>
  </main>

  <footer>
    <p>Nothing is uploaded. <a href="https://github.com/hungbo/tools">Source on GitHub</a>.</p>
  </footer>

</div>

<script type="module">
import { tray, list, result, fail } from '../assets/app.js';

let file = null;
let pageCount = 0;
const ul = document.getElementById('files');
const go = document.getElementById('go');
const out = document.getElementById('out');
const err = document.getElementById('err');
const range = document.getElementById('range');
const label = document.querySelector('label[for="range"]');

// "1-3, 7" -> [0,1,2,6]. Throws on anything outside the document.
function parseRange(text, max) {
  const wanted = [];
  for (const part of text.split(',')) {
    const bit = part.trim();
    if (!bit) continue;
    const m = bit.match(/^(\d+)(?:\s*-\s*(\d+))?$/);
    if (!m) throw new Error('"' + bit + '" is not a page or a range like 2-5.');
    const from = +m[1];
    const to = m[2] ? +m[2] : from;
    if (from < 1 || to > max) throw new Error('This PDF has ' + max + ' pages, so "' + bit + '" is out of range.');
    if (to < from) throw new Error('"' + bit + '" runs backwards.');
    for (let p = from; p <= to; p++) wanted.push(p - 1);
  }
  if (!wanted.length) throw new Error('Name at least one page, for example 1-3.');
  return wanted;
}

function render() {
  list(ul, file ? [file] : [], { onRemove: () => { file = null; pageCount = 0; render(); } });
  go.disabled = !file;
  if (!file) label.textContent = 'Pages to keep';
}

tray(document.getElementById('tray'), document.getElementById('pick'), async (picked) => {
  out.hidden = true;
  err.hidden = true;
  file = picked[0] || null;
  render();
  if (!file) return;
  try {
    const doc = await PDFLib.PDFDocument.load(await file.arrayBuffer(), { ignoreEncryption: true });
    pageCount = doc.getPageCount();
    range.value = '1-' + pageCount;
    label.textContent = 'Pages to keep (of ' + pageCount + ')';
  } catch (e) {
    fail(err, 'Could not read this PDF. A password-protected or damaged file is the usual cause.');
    file = null;
    render();
  }
});

go.addEventListener('click', async () => {
  out.hidden = true;
  err.hidden = true;
  go.disabled = true;
  go.textContent = 'Working…';
  try {
    const { PDFDocument } = PDFLib;
    const src = await PDFDocument.load(await file.arrayBuffer(), { ignoreEncryption: true });
    const wanted = parseRange(range.value, src.getPageCount());
    const picked = await PDFDocument.create();
    const pages = await picked.copyPages(src, wanted);
    pages.forEach((p) => picked.addPage(p));
    const blob = new Blob([await picked.save()], { type: 'application/pdf' });
    const name = file.name.replace(/\.pdf$/i, '') + '-pages.pdf';
    result(out, blob, name, wanted.length + ' of ' + src.getPageCount() + ' pages.');
  } catch (e) {
    fail(err, e.message);
  }
  go.textContent = 'Take these pages';
  render();
});

render();
</script>
</body>
</html>

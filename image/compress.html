<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compress image — tools</title>
<meta name="description" content="Make a JPEG, PNG or WebP smaller by quality or width. Runs in your browser; files are never uploaded.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%231F3A2E'/><path d='M8 7h11l5 5v13H8z' fill='none' stroke='%232B44FF' stroke-width='2.5'/></svg>">
<style>
  .peek { max-width: 100%; height: auto; border: 1px solid var(--rule); margin-bottom: 0.9rem; display: block; }
  .out .delta { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 600; font-size: 1.5rem; letter-spacing: -0.02em; margin: 0 0 0.6rem; }
  .note { font-size: 0.9rem; color: var(--ink-2); margin: -0.9rem 0 1.5rem; max-width: 46ch; }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <a class="mark" href="../">tools<span>.</span></a>
    <p class="local"><a class="back" href="../">All tools</a></p>
  </header>

  <main>
    <h1>Compress image</h1>
    <p class="lede">Lower the quality, cap the width, or both. The format stays the same — check the preview before you save.</p>

    <label class="tray" id="tray">
      <strong>Drop an image here</strong>
      <span>JPEG, PNG or WebP</span>
      <input type="file" id="pick" accept="image/jpeg,image/png,image/webp">
    </label>

    <ul class="files" id="files"></ul>

    <div class="row">
      <div>
        <label for="q">Quality <span id="qv">75</span></label>
        <input type="range" id="q" min="20" max="100" value="75">
      </div>
      <div>
        <label for="w">Largest width in pixels</label>
        <input type="text" id="w" size="8" placeholder="leave blank to keep">
      </div>
    </div>
    <p class="note" id="note" hidden>PNG has no quality setting. Capping the width is what shrinks it — or convert it to JPEG or WebP.</p>

    <button class="go" id="go" disabled>Compress</button>

    <div class="out" id="out" hidden></div>
    <p class="err" id="err" hidden></p>
  </main>

  <footer>
    <p>Nothing is uploaded. <a href="https://github.com/hungbo/tools">Source on GitHub</a>.</p>
  </footer>

</div>

<script type="module">
import { tray, list, fmt, fail } from '../assets/app.js';

let file = null;
const ul = document.getElementById('files');
const go = document.getElementById('go');
const out = document.getElementById('out');
const err = document.getElementById('err');
const q = document.getElementById('q');
const qv = document.getElementById('qv');
const w = document.getElementById('w');
const note = document.getElementById('note');

q.addEventListener('input', () => { qv.textContent = q.value; });

function render() {
  list(ul, file ? [file] : [], { onRemove: () => { file = null; render(); } });
  go.disabled = !file;
  const isPng = file && file.type === 'image/png';
  note.hidden = !isPng;
  q.disabled = !!isPng;
}

tray(document.getElementById('tray'), document.getElementById('pick'), (picked) => {
  out.hidden = true;
  err.hidden = true;
  file = picked[0] || null;
  render();
});

go.addEventListener('click', async () => {
  out.hidden = true;
  err.hidden = true;
  go.disabled = true;
  go.textContent = 'Compressing…';
  try {
    const bitmap = await createImageBitmap(file);
    const cap = parseInt(w.value, 10);
    const scale = cap > 0 ? Math.min(1, cap / bitmap.width) : 1;
    const cw = Math.max(1, Math.round(bitmap.width * scale));
    const ch = Math.max(1, Math.round(bitmap.height * scale));

    const canvas = document.createElement('canvas');
    canvas.width = cw;
    canvas.height = ch;
    canvas.getContext('2d').drawImage(bitmap, 0, 0, cw, ch);

    const blob = await new Promise((res, rej) =>
      canvas.toBlob((b) => (b ? res(b) : rej(new Error('encoding failed'))), file.type, q.value / 100)
    );

    const pct = Math.round((1 - blob.size / file.size) * 100);
    const url = URL.createObjectURL(blob);
    const name = file.name.replace(/(\.[a-z0-9]+)$/i, '-small$1');

    out.innerHTML = '';
    const img = document.createElement('img');
    img.className = 'peek';
    img.src = url;
    img.alt = 'Preview of the compressed image';
    const head = document.createElement('p');
    head.className = 'delta';
    head.textContent = pct > 0 ? fmt(file.size) + ' to ' + fmt(blob.size) + ', ' + pct + '% off'
                               : fmt(file.size) + ' to ' + fmt(blob.size);
    const sub = document.createElement('p');
    sub.textContent = cw + ' by ' + ch + ' pixels' + (scale < 1 ? ', scaled down from ' + bitmap.width : '');
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.textContent = 'Save ' + name;
    out.append(img, head, sub, a);
    out.hidden = false;

    if (pct <= 0) fail(err, 'This came out no smaller. The original is already well compressed — try a lower quality or a smaller width.');
  } catch (e) {
    fail(err, 'Could not read this image. (' + e.message + ')');
  }
  go.textContent = 'Compress';
  render();
});

render();
</script>
</body>
</html>
